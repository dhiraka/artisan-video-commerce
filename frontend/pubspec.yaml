name: artisan_commerce
description: Artisan Video-Commerce Platform — buy handmade goods backed by process videos.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.4.3

  # Video playback
  video_player: ^2.8.3
  chewie: ^1.7.5

  # File/video picking
  file_picker: ^8.1.2

  # State management
  provider: ^6.1.2

  # Image caching
  cached_network_image: ^3.3.1

  # UI utilities
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.19.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
